// Global State
const state = {
  currentUser: null,
  activeRole: null,
  adminStudents: [],
  teacherClassData: null,
  parentData: null
};

/**
 * Promise wrapper untuk memanggil fungsi Google Apps Script di backend
 */
function callGAS(funcName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn("GAS Environment tidak terdeteksi. Running in standalone mock mode.");
      resolve({ success: false, message: "Aplikasi berjalan di luar Google Apps Script." });
      return;
    }

    google.script.run
      .withSuccessHandler(response => {
        if (!response) {
          resolve({ 
            success: false, 
            message: "Respon server kosong. Pastikan fungsi 'initialSetup' sudah dijalankan di Apps Script." 
          });
        } else {
          resolve(response);
        }
      })
      .withFailureHandler(error => {
        resolve({ 
          success: false, 
          message: (error && error.message) ? error.message : String(error) 
        });
      })
      [funcName](...args);
  });
}

// Inisialisasi saat Halaman Dimuat
document.addEventListener('DOMContentLoaded', () => {
  // Cek apakah ada sesi tersimpan di localStorage
  const savedUser = localStorage.getItem('ANAK_SALEH_SESSION');
  if (savedUser) {
    try {
      const user = JSON.parse(savedUser);
      setSession(user);
    } catch (e) {
      localStorage.removeItem('ANAK_SALEH_SESSION');
      showLoginView();
    }
  } else {
    showLoginView();
  }
});

/**
 * Switch Tab Login (Orang Tua vs Wali Kelas/Admin)
 */
function switchLoginRole(role) {
  const tabOrtu = document.getElementById('tabBtnOrtu');
  const tabStaff = document.getElementById('tabBtnStaff');
  const formOrtu = document.getElementById('formLoginOrtu');
  const formStaff = document.getElementById('formLoginStaff');

  if (role === 'ORTU') {
    tabOrtu.className = 'w-1/2 py-2.5 rounded-xl font-bold text-sm transition bg-teal-600 text-white shadow-md';
    tabStaff.className = 'w-1/2 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 hover:text-slate-800';
    formOrtu.classList.remove('hidden');
    formStaff.classList.add('hidden');
  } else {
    tabStaff.className = 'w-1/2 py-2.5 rounded-xl font-bold text-sm transition bg-teal-600 text-white shadow-md';
    tabOrtu.className = 'w-1/2 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 hover:text-slate-800';
    formStaff.classList.remove('hidden');
    formOrtu.classList.add('hidden');
  }
}

/**
 * Handle Form Submit Login Orang Tua
 */
async function handleLoginOrtu(e) {
  e.preventDefault();
  const nis = document.getElementById('loginOrtuNis').value.trim();
  const pin = document.getElementById('loginOrtuPin').value.trim();
  const btn = document.getElementById('btnSubmitLoginOrtu');

  if (!nis || !pin) {
    showToast("Silakan masukkan NIS dan PIN Anda.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Memeriksa Data...`;

  try {
    const res = await callGAS('handleLogin', {
      role: 'ORTU',
      identifier: nis,
      secret: pin
    });

    if (res.success) {
      showToast(res.message, "success");
      setSession(res.data);
    } else {
      showToast(res.message || "Gagal masuk. Periksa kembali NIS dan PIN.", "error");
    }
  } catch (err) {
    showToast("Terjadi kesalahan: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `Masuk ke Portal Orang Tua <i class="fas fa-arrow-right ml-2"></i>`;
  }
}

/**
 * Handle Form Submit Login Guru / Admin
 */
async function handleLoginStaff(e) {
  e.preventDefault();
  const role = document.getElementById('loginStaffRole').value;
  const username = document.getElementById('loginStaffUsername').value.trim();
  const password = document.getElementById('loginStaffPassword').value.trim();
  const btn = document.getElementById('btnSubmitLoginStaff');

  if (!username || !password) {
    showToast("Silakan masukkan username dan kata sandi.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Masuk...`;

  try {
    const res = await callGAS('handleLogin', {
      role: role,
      identifier: username,
      secret: password
    });

    if (res.success) {
      showToast(res.message, "success");
      setSession(res.data);
    } else {
      showToast(res.message || "Username atau password salah.", "error");
    }
  } catch (err) {
    showToast("Terjadi kesalahan: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `Masuk ke Dashboard Staff <i class="fas fa-arrow-right ml-2"></i>`;
  }
}

/**
 * Set User Session & Navigasi ke View yang Sesuai
 */
function setSession(userData) {
  state.currentUser = userData;
  state.activeRole = userData.role;
  localStorage.setItem('ANAK_SALEH_SESSION', JSON.stringify(userData));

  document.getElementById('loginContainer').classList.add('hidden');
  document.getElementById('userNavbarSection').classList.remove('hidden');

  // Update navbar info
  const nameLabel = userData.role === 'ORTU' 
    ? `Ayah/Bunda dari ${userData.namaPanggilan || userData.namaSiswa}`
    : userData.namaLengkap;
  
  document.getElementById('navUserName').innerText = nameLabel;
  document.getElementById('navUserRoleBadge').innerText = userData.role === 'ADMIN' ? 'Administrator' : (userData.role === 'WALI_KELAS' ? 'Wali Kelas ' + (userData.kelasDiampu || '') : 'Wali Murid');

  // Switch View
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('teacherView').classList.add('hidden');
  document.getElementById('parentView').classList.add('hidden');

  if (userData.role === 'ADMIN') {
    document.getElementById('adminView').classList.remove('hidden');
    loadAdminDashboardData();
  } else if (userData.role === 'WALI_KELAS') {
    document.getElementById('teacherView').classList.remove('hidden');
    loadTeacherClassData();
  } else if (userData.role === 'ORTU') {
    document.getElementById('parentView').classList.remove('hidden');
    loadParentData();
  }
}

/**
 * Logout
 */
function handleLogout() {
  localStorage.removeItem('ANAK_SALEH_SESSION');
  state.currentUser = null;
  state.activeRole = null;
  showLoginView();
  showToast("Anda telah keluar dari sesi.", "info");
}

function showLoginView() {
  document.getElementById('loginContainer').classList.remove('hidden');
  document.getElementById('userNavbarSection').classList.add('hidden');
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('teacherView').classList.add('hidden');
  document.getElementById('parentView').classList.add('hidden');
}

function switchAdminTab(tabName) {
  const tabs = ['siswa', 'guru', 'kelas', 'tahun', 'logs'];
  tabs.forEach(t => {
    const btn = document.getElementById('adminTabBtn_' + t);
    const content = document.getElementById('adminTabContent_' + t);
    if (btn && content) {
      if (t === tabName) {
        btn.className = 'admin-tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-teal-600 text-white shadow-sm';
        content.classList.remove('hidden');
      } else {
        btn.className = 'admin-tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-50';
        content.classList.add('hidden');
      }
    }
  });

  if (tabName === 'siswa') loadAdminStudents();
  if (tabName === 'guru') loadAdminTeachers();
  if (tabName === 'kelas') loadAdminClasses();
  if (tabName === 'tahun') loadAdminAcademicYears();
  if (tabName === 'logs') loadAdminLogs();
}

async function loadAdminDashboardData() {
  try {
    const res = await callGAS('getAdminDashboardSummary');
    if (res.success && res.data) {
      const d = res.data;
      document.getElementById('statTotalSiswa').innerText = d.totalSiswa || '0';
      
      const jBreakdown = Object.entries(d.perJenjang || {})
        .map(([k, v]) => `${k.replace('Playgroup (PG)', 'PG')}: ${v}`)
        .join(' | ');
      document.getElementById('statJenjangBreakdown').innerText = jBreakdown || '-';

      document.getElementById('statTotalGuru').innerText = d.totalWaliKelas || '0';
      document.getElementById('statTotalKelas').innerText = (d.totalKelas || '0') + ' Rombel Kelas';

      document.getElementById('statTAAktif').innerText = `${d.activeTA.tahun || '-'} (${d.activeTA.semester || '-'})`;
      document.getElementById('statStatusAksesOrtu').innerText = `Akses Ortu: ${d.activeTA.statusAksesOrtu || 'DITUTUP'}`;

      document.getElementById('statRaportUploaded').innerText = `${d.totalRaportUploaded || 0} / ${d.totalSiswa || 0}`;
      document.getElementById('statRaportDilihat').innerText = `${d.totalRaportDilihatOrtu || 0} sudah dilihat orang tua`;
    }
  } catch (err) {
    console.error(err);
  }
  loadAdminStudents();
}

async function loadAdminStudents() {
  const jenjang = document.getElementById('filterJenjangSelect')?.value || 'SEMUA';
  const tbody = document.getElementById('adminSiswaTableBody');
  if (!tbody) return;

  tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat data siswa...</td></tr>`;

  try {
    const res = await callGAS('getStudentsListAdmin', jenjang, 'SEMUA');
    if (res.success && res.data) {
      state.adminStudents = res.data;
      renderAdminStudentsTable(res.data);
    }
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Gagal memuat: ${err.message}</td></tr>`;
  }
}

function renderAdminStudentsTable(list) {
  const tbody = document.getElementById('adminSiswaTableBody');
  if (!tbody) return;

  if (!list || list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(s => `
    <tr class="hover:bg-slate-50 transition">
      <td class="p-3 font-semibold text-slate-800">${s.nis}</td>
      <td class="p-3">
        <div class="font-bold text-slate-800">${s.namaSiswa}</div>
        <div class="text-xs text-slate-400">Panggilan: ${s.namaPanggilan || '-'} | ${s.jenisKelamin}</div>
      </td>
      <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-sky-100 text-sky-800">${s.jenjang}</span></td>
      <td class="p-3 font-medium text-slate-700">${s.kelas}</td>
      <td class="p-3">
        <div class="text-xs text-slate-700 font-medium">${s.namaOrangtua || '-'}</div>
        <div class="text-xs text-teal-600"><i class="fab fa-whatsapp mr-1"></i>${s.noWa || '-'}</div>
      </td>
      <td class="p-3 font-mono font-bold text-slate-700">${s.pinOrtu || '1234'}</td>
      <td class="p-3 text-center">
        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${s.status === 'AKTIF' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
          ${s.status}
        </span>
      </td>
      <td class="p-3 text-center">
        <div class="flex items-center justify-center gap-1.5">
          <button onclick="editStudentModal('${s.nis}')" class="p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg" title="Edit Siswa">
            <i class="fas fa-edit"></i>
          </button>
          <button onclick="deleteStudentAdminAction('${s.nis}', '${s.namaSiswa}')" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg" title="Hapus Siswa">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filterSiswaTable() {
  const q = document.getElementById('searchSiswaInput').value.toLowerCase();
  const filtered = state.adminStudents.filter(s => 
    s.nis.toLowerCase().includes(q) || 
    s.namaSiswa.toLowerCase().includes(q) ||
    (s.namaOrangtua && s.namaOrangtua.toLowerCase().includes(q))
  );
  renderAdminStudentsTable(filtered);
}

async function populateStudentClassDropdown(selectedClass = '', jenjang = '') {
  const select = document.getElementById('formStudentKelas');
  if (!select) return;

  if (!adminClassesListCache || adminClassesListCache.length === 0) {
    try {
      const res = await callGAS('getClassesListAdmin');
      if (res.success && res.data) adminClassesListCache = res.data;
    } catch (e) {}
  }

  let classes = adminClassesListCache || [];
  if (jenjang && jenjang !== 'SEMUA') {
    classes = classes.filter(k => k.jenjang === jenjang);
  }

  if (classes.length === 0) {
    select.innerHTML = `<option value="">-- Tidak ada kelas untuk jenjang ini --</option>`;
    return;
  }

  select.innerHTML = `<option value="">-- Pilih Kelas --</option>` + 
    classes.map(k => `
      <option value="${k.idKelas}" ${k.idKelas === selectedClass ? 'selected' : ''}>
        ${k.namaKelas} (${k.idKelas})
      </option>
    `).join('');
}

function handleStudentJenjangChange() {
  const jenjang = document.getElementById('formStudentJenjang').value;
  populateStudentClassDropdown('', jenjang);
}

async function populateTeacherClassDropdown(selectedClass = '') {
  const select = document.getElementById('formTeacherKelas');
  if (!select) return;

  if (!adminClassesListCache || adminClassesListCache.length === 0) {
    try {
      const res = await callGAS('getClassesListAdmin');
      if (res.success && res.data) adminClassesListCache = res.data;
    } catch (e) {}
  }

  const classes = adminClassesListCache || [];
  select.innerHTML = `<option value="">-- Pilih Kelas Diampu (Opsional) --</option>` + 
    classes.map(k => `
      <option value="${k.idKelas}" ${k.idKelas === selectedClass ? 'selected' : ''}>
        ${k.namaKelas} (${k.idKelas}) - ${k.jenjang}
      </option>
    `).join('');
}

  document.getElementById('formStudentOrtu').value = "";
  document.getElementById('formStudentWa').value = "";

async function editStudentModal(nis) {
  const s = state.adminStudents.find(item => item.nis === nis);
  if (!s) return;

  document.getElementById('modalStudentTitle').innerText = "Edit Data Siswa";
  document.getElementById('formStudentNis').value = s.nis;
  document.getElementById('formStudentNis').disabled = true;
  document.getElementById('formStudentNisn').value = s.nisn;
  document.getElementById('formStudentNama').value = s.namaSiswa;
  document.getElementById('formStudentPanggilan').value = s.namaPanggilan;
  document.getElementById('formStudentJenjang').value = s.jenjang;
  document.getElementById('formStudentJK').value = s.jenisKelamin;
  document.getElementById('formStudentTglLahir').value = s.tanggalLahir || "";
  document.getElementById('formStudentOrtu').value = s.namaOrangtua || "";
  document.getElementById('formStudentWa').value = s.noWa || "";
  document.getElementById('formStudentPin').value = s.pinOrtu || "1234";
  document.getElementById('formStudentStatus').value = s.status || "AKTIF";

  await populateStudentClassDropdown(s.kelas, s.jenjang);
  document.getElementById('modalStudent').classList.remove('hidden');
}

async function handleSaveStudent(e) {
  e.preventDefault();
  const kelasDipilih = document.getElementById('formStudentKelas').value;
  if (!kelasDipilih) {
    showToast("Silakan pilih kelas terlebih dahulu!", "warning");
    return;
  }

  const studentObj = {
    nis: document.getElementById('formStudentNis').value.trim(),
    nisn: document.getElementById('formStudentNisn').value.trim(),
    namaSiswa: document.getElementById('formStudentNama').value.trim(),
    namaPanggilan: document.getElementById('formStudentPanggilan').value.trim(),
    jenjang: document.getElementById('formStudentJenjang').value,
    kelas: kelasDipilih,
    jenisKelamin: document.getElementById('formStudentJK').value,
    tanggalLahir: document.getElementById('formStudentTglLahir').value,
    namaOrangtua: document.getElementById('formStudentOrtu').value.trim(),
    noWa: document.getElementById('formStudentWa').value.trim(),
    pinOrtu: document.getElementById('formStudentPin').value.trim(),
    status: document.getElementById('formStudentStatus').value
  };

  const btn = document.getElementById('btnSaveStudent');
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...`;

  try {
    const res = await callGAS('saveStudentAdmin', studentObj, state.currentUser?.namaLengkap);
    if (res.success) {
      showToast(res.message, "success");
      document.getElementById('modalStudent').classList.add('hidden');
      loadAdminStudents();
      loadAdminClasses();
    } else {
      showToast(res.message, "error");
    }
  } catch (err) {
    showToast("Error: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `Simpan Data Siswa`;
  }
}

async function deleteStudentAdminAction(nis, nama) {
  if (!confirm(`Apakah Anda yakin ingin menghapus data siswa ${nama} (NIS: ${nis})?`)) return;

  try {
    const res = await callGAS('deleteStudentAdmin', nis, state.currentUser?.namaLengkap);
    if (res.success) {
      showToast(res.message, "success");
      loadAdminStudents();
      loadAdminClasses();
    } else {
      showToast(res.message, "error");
    }
  } catch (err) {
    showToast("Error: " + err.message, "error");
  }
}

function handleCsvFileSelected(event) {
  const file = event.target.files[0];
  if (!file) return;

  document.getElementById('csvFileLabel').innerHTML = `<span class="text-emerald-700 font-bold"><i class="fas fa-file-csv mr-1"></i> ${file.name}</span>`;

  const reader = new FileReader();
  reader.onload = function(e) {
    parseCsvOrTabSeparated(e.target.result);
  };
  reader.readAsText(file);
}

function handleBulkPasteInput() {
  const text = document.getElementById('bulkPasteTextarea').value.trim();
  if (text) {
    parseCsvOrTabSeparated(text);
  } else {
    clearBulkParsedData();
  }
}

function parseCsvOrTabSeparated(rawText) {
  if (!rawText) return;
  const lines = rawText.split(/\r\n|\n|\r/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return;

  const results = [];
  let startIndex = 0;

  // Cek apakah baris pertama adalah Header
  const firstLine = lines[0].toLowerCase();
  if (firstLine.includes('nis') || firstLine.includes('nama') || firstLine.includes('siswa')) {
    startIndex = 1; // Lewati header
  }

  for (let i = startIndex; i < lines.length; i++) {
    const line = lines[i];
    // Pisahkan dengan Koma (CSV) atau Tab (Excel copy-paste) atau Titik Koma (CSV Indo)
    let cols = [];
    if (line.includes('\t')) {
      cols = line.split('\t');
    } else if (line.includes(';')) {
      cols = line.split(';');
    } else {
      cols = line.split(',');
    }

    cols = cols.map(c => c.replace(/^["']|["']$/g, '').trim());

    if (cols.length >= 2 && cols[0] && cols[2]) {
      // Urutan: [NIS, NISN, Nama_Siswa, Panggilan, Jenjang, Kelas, JK, Tanggal_Lahir, Nama_Ortu, No_WA, PIN, Status]
      results.push({
        nis: cols[0] || "",
        nisn: cols[1] || "",
        namaSiswa: cols[2] || cols[1] || "",
        namaPanggilan: cols[3] || (cols[2] ? cols[2].split(" ")[0] : ""),
        jenjang: cols[4] || "Playgroup (PG)",
        kelas: cols[5] || "PG-A",
        jenisKelamin: cols[6] || "Laki-laki",
        tanggalLahir: cols[7] || "",
        namaOrangtua: cols[8] || "",
        noWa: cols[9] || "",
        pinOrtu: cols[10] || "1234",
        status: cols[11] || "AKTIF"
      });
    } else if (cols.length >= 2 && cols[0] && cols[1]) {
      // Minimal format 2 kolom: NIS dan Nama Siswa
      results.push({
        nis: cols[0],
        nisn: "",
        namaSiswa: cols[1],
        namaPanggilan: cols[1].split(" ")[0],
        jenjang: "Playgroup (PG)",
        kelas: "PG-A",
        jenisKelamin: "Laki-laki",
        tanggalLahir: "",
        namaOrangtua: "",
        noWa: "",
        pinOrtu: "1234",
        status: "AKTIF"
      });
    }
  }

  parsedBulkStudents = results;
  renderBulkPreview(results);
}

function renderBulkPreview(list) {
  const section = document.getElementById('bulkPreviewSection');
  const tbody = document.getElementById('bulkPreviewTableBody');
  const countLabel = document.getElementById('bulkParsedCount');
  const submitBtn = document.getElementById('btnSubmitBulkUpload');

  if (!list || list.length === 0) {
    section.classList.add('hidden');
    submitBtn.disabled = true;
    return;
  }

  section.classList.remove('hidden');
  countLabel.innerText = `${list.length} Siswa`;
  submitBtn.disabled = false;

  tbody.innerHTML = list.map(s => `
    <tr class="hover:bg-slate-50">
      <td class="p-2 font-bold text-slate-800">${s.nis}</td>
      <td class="p-2">${s.namaSiswa}</td>
      <td class="p-2"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-sky-100 text-sky-800">${s.jenjang}</span></td>
      <td class="p-2 font-semibold text-teal-700">${s.kelas}</td>
      <td class="p-2 text-slate-600">${s.namaOrangtua || '-'}</td>
      <td class="p-2 font-mono font-bold">${s.pinOrtu || '1234'}</td>
    </tr>
  `).join('');
}

async function submitBulkStudentsImport() {
  if (!parsedBulkStudents || parsedBulkStudents.length === 0) {
    showToast("Tidak ada data siswa yang valid untuk diimpor.", "warning");
    return;
  }

  const btn = document.getElementById('btnSubmitBulkUpload');
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Mengimpor ${parsedBulkStudents.length} siswa...`;

  try {
    const res = await callGAS('bulkSaveStudentsAdmin', parsedBulkStudents, state.currentUser?.namaLengkap);
    if (res.success) {
      showToast(res.message, "success");
      document.getElementById('modalBulkUploadStudent').classList.add('hidden');
      loadAdminStudents();
      loadAdminClasses();
      loadAdminDashboardData();
    } else {
      showToast(res.message, "error");
    }
  } catch (err) {
    showToast("Error saat import: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1"></i> Proses & Simpan Semua`;
  }
}

async function loadTeacherClassData() {
  const teacherClass = state.currentUser?.kelasDiampu || 'PG-A';
  const tbody = document.getElementById('teacherStudentsTableBody');
  tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat siswa kelas ${teacherClass}...</td></tr>`;

  document.getElementById('teacherClassTitle').innerText = `Kelas ${teacherClass}`;
  document.getElementById('teacherWelcomeSub').innerText = `Selamat bertugas, ${state.currentUser?.namaLengkap}.`;

  try {
    const res = await callGAS('getTeacherClassStudents', teacherClass);
    if (res.success && res.data) {
      state.teacherClassData = res.data;
      
      document.getElementById('teacherActiveTA').innerText = `${res.data.activeTA.tahun} - ${res.data.activeTA.semester}`;

      const total = res.data.students.length;
      const uploaded = res.data.students.filter(s => s.hasRaport).length;
      const pending = total - uploaded;
      const viewed = res.data.students.filter(s => s.hasRaport && s.raport.statusKonfirmasiOrtu === 'SUDAH_DILIHAT').length;

      document.getElementById('teacherStatTotal').innerText = total;
      document.getElementById('teacherStatUploaded').innerText = uploaded;
      document.getElementById('teacherStatPending').innerText = pending;
      document.getElementById('teacherStatViewed').innerText = viewed;

      renderTeacherStudentsTable(res.data.students);
    }
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Error: ${err.message}</td></tr>`;
  }
}

    return;
  }

  tbody.innerHTML = students.map(s => {
    const r = s.raport;
    const hasReport = s.hasRaport;

    return `
      <tr class="hover:bg-slate-50 transition">
        <td class="p-3 font-semibold text-slate-800">${s.nis}</td>
        <td class="p-3">
          <div class="font-bold text-slate-800">${s.namaSiswa}</div>
          <div class="text-xs text-slate-400">Panggilan: ${s.panggilan || '-'} | ${s.jenjang}</div>
        </td>
        <td class="p-3">
          <div class="text-xs text-slate-700 font-medium">${s.namaOrangtua || '-'}</div>
          <div class="text-xs text-teal-600"><i class="fab fa-whatsapp mr-1"></i>${s.noWa || '-'}</div>
        </td>
        <td class="p-3 text-center">
          ${hasReport ? `
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
              <i class="fas fa-check-circle"></i> Terunggah (PDF)
            </span>
          ` : `
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
              <i class="fas fa-clock"></i> Belum Ada Raport
            </span>
          `}
        </td>
        <td class="p-3 text-center text-xs">
          ${hasReport && r.tanggalDilihatOrtu !== '-' ? `
            <span class="text-teal-700 font-semibold"><i class="fas fa-eye mr-1"></i>${r.tanggalDilihatOrtu}</span>
          ` : `<span class="text-slate-400">Belum diakses</span>`}
        </td>
        <td class="p-3 text-center">
          <div class="flex items-center justify-center gap-2">
            <button onclick="openUploadModal('${s.nis}', '${s.namaSiswa}', '${s.kelas}', '${s.jenjang}', '${r ? (r.catatanGuru || '') : ''}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-sky-600 hover:bg-sky-700 text-white transition flex items-center gap-1 shadow-sm">
              <i class="fas fa-file-upload"></i> ${hasReport ? 'Ganti PDF' : 'Upload Raport'}
            </button>
            ${hasReport ? `
              <button onclick="openPdfModal('${r.previewUrl}', 'Raport - ${s.namaSiswa}')" class="p-1.5 text-teal-700 hover:bg-teal-50 rounded-lg" title="Lihat Pratinjau">
                <i class="fas fa-eye"></i>
              </button>
              <button onclick="deleteReportAction('${r.idRaport}', '${s.namaSiswa}')" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg" title="Hapus Raport">
                <i class="fas fa-trash-alt"></i>
              </button>
            ` : ''}
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function filterTeacherTable() {
  const q = document.getElementById('teacherSearchInput').value.toLowerCase();
  const filterStatus = document.getElementById('teacherStatusFilter').value;

  if (!state.teacherClassData) return;

  const filtered = state.teacherClassData.students.filter(s => {
    const matchQuery = s.nis.toLowerCase().includes(q) || s.namaSiswa.toLowerCase().includes(q);
    let matchStatus = true;
    if (filterStatus === 'UPLOADED') matchStatus = s.hasRaport;
    if (filterStatus === 'PENDING') matchStatus = !s.hasRaport;
    return matchQuery && matchStatus;
  });

  renderTeacherStudentsTable(filtered);
}

// Upload Modal State
let currentUploadState = {
  nis: null,
  namaSiswa: null,
  kelas: null,
  jenjang: null,
  fileBase64: null,
  fileName: null,
  mimeType: null
};

function openUploadModal(nis, namaSiswa, kelas, jenjang, catatanLama) {
  currentUploadState = {
    nis: nis,
    namaSiswa: namaSiswa,
    kelas: kelas,
    jenjang: jenjang,
    fileBase64: null,
    fileName: null,
    mimeType: null
  };

  document.getElementById('uploadModalChildName').innerText = `${namaSiswa} (${nis})`;
  document.getElementById('uploadModalClass').innerText = `Kelas: ${kelas} | ${jenjang}`;
  document.getElementById('uploadCatatanGuru').value = catatanLama || "Alhamdulillah ananda menunjukkan perkembangan yang sangat baik dalam kemandirian, sosialisasi, dan pembiasaan ibadah harian. Terus bersemangat!";
  document.getElementById('uploadFileNotice').innerText = "Pilih atau seret berkas PDF raport siswa (maks. 10MB)";
  document.getElementById('uploadFileInput').value = "";
  
  document.getElementById('modalUploadRaport').classList.remove('hidden');
}

function handleFileSelected(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
    showToast("Berkas harus berformat PDF!", "warning");
    event.target.value = "";
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    showToast("Ukuran file terlalu besar (maks 10MB)", "warning");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    currentUploadState.fileBase64 = e.target.result;
    currentUploadState.fileName = file.name;
    currentUploadState.mimeType = file.type || 'application/pdf';
    document.getElementById('uploadFileNotice').innerHTML = `<span class="text-emerald-700 font-bold"><i class="fas fa-file-pdf mr-1"></i> ${file.name} (${Math.round(file.size / 1024)} KB)</span>`;
  };
  reader.readAsDataURL(file);
}

async function submitUploadRaportForm(e) {
  e.preventDefault();

  if (!currentUploadState.fileBase64) {
    showToast("Silakan pilih file PDF raport terlebih dahulu!", "warning");
    return;
  }

  const btn = document.getElementById('btnSubmitUpload');
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Mengunggah ke Google Drive...`;

  const payload = {
    nis: currentUploadState.nis,
    namaSiswa: currentUploadState.namaSiswa,
    kelas: currentUploadState.kelas,
    jenjang: currentUploadState.jenjang,
    tahunAjaran: state.teacherClassData?.activeTA?.tahun || "2026/2027",
    semester: state.teacherClassData?.activeTA?.semester || "Ganjil (Semester 1)",
    catatanGuru: document.getElementById('uploadCatatanGuru').value.trim(),
    statusPublish: document.getElementById('uploadStatusPublish').checked ? "PUBLISHED" : "DRAFT",
    fileBase64: currentUploadState.fileBase64,
    fileName: currentUploadState.fileName,
    mimeType: currentUploadState.mimeType,
    uploaderUser: state.currentUser?.namaLengkap || "Wali Kelas"
  };

  try {
    const res = await callGAS('uploadStudentReport', payload);
    if (res.success) {
      showToast(res.message, "success");
      document.getElementById('modalUploadRaport').classList.add('hidden');
      loadTeacherClassData();
    } else {
      showToast(res.message, "error");
    }
  } catch (err) {
    showToast("Error saat upload: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1.5"></i> Simpan & Unggah Raport`;
  }
}

async function deleteReportAction(reportId, studentName) {
  if (!confirm(`Hapus berkas raport ananda ${studentName}? Berkas di Google Drive juga akan dihapus.`)) return;

  try {
    const res = await callGAS('deleteStudentReport', reportId, state.currentUser?.namaLengkap);
    if (res.success) {
      showToast(res.message, "success");
      loadTeacherClassData();
    } else {
      showToast(res.message, "error");
    }
  } catch (err) {
    showToast("Error: " + err.message, "error");
  }
}

/**
 * ============================================================================
 * PDF VIEWER MODAL & TOAST NOTIFICATION
 * ============================================================================
 */

function openPdfModal(url, title) {
  document.getElementById('pdfModalTitle').innerText = title || 'Pratinjau Raport';
  document.getElementById('pdfModalIframe').src = url;
  document.getElementById('modalPdfViewer').classList.remove('hidden');
}

function closePdfModal() {
  document.getElementById('pdfModalIframe').src = "";
  document.getElementById('modalPdfViewer').classList.add('hidden');
}

function showToast(msg, type = "info") {
  const toast = document.getElementById('toastNotification');
  const toastMsg = document.getElementById('toastMessage');
  const toastIcon = document.getElementById('toastIcon');

  toastMsg.innerText = msg;
  
  if (type === 'success') {
    toastIcon.className = "fas fa-check-circle text-emerald-400 text-lg";
  } else if (type === 'error') {
    toastIcon.className = "fas fa-exclamation-circle text-rose-400 text-lg";
  } else if (type === 'warning') {
    toastIcon.className = "fas fa-exclamation-triangle text-amber-400 text-lg";
  } else {
    toastIcon.className = "fas fa-info-circle text-sky-400 text-lg";
  }

  toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
  }, 4000);
}
