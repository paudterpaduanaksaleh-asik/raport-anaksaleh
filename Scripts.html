<script>
/**
 * ============================================================================
 * CLIENT CONTROLLER & APPLICATION LOGIC (SCRIPTS)
 * PG - TK - DAYCARE ANAK SALEH
 * Multi-Role: Admin, Kepala Sekolah, Wali Kelas, Wali Murid

 */

// URL Backend Google Apps Script Web App (API Endpoint)
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz28JnLoMuky8QP_0YYaMURpds12LY2PuBSK29R7hidLAdgnNhXnh-oW1kcEcSVGXYoNg/exec";

// Global State
const state = {
  currentUser: null,
  activeRole: null,
  adminData: {
    students: [],
    teachers: [],
    classes: [],
    years: []
  },
  kepsekData: {
    reports: [],
    kelompokList: []
  },
  teacherData: {
    infoKelompok: null,
    muridList: []
  },
  parentData: null
};

/**
 * Universal Promise Wrapper untuk memanggil backend GAS
 * Menggunakan Dual-Transport (Fetch GET + JSONP Fallback) untuk keandalan 100%
 */
async function callGAS(funcName, ...args) {
  // 1. Jika berjalan di dalam Google Apps Script Web App asli
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(response => {
          resolve(response || { success: false, message: "Respon server kosong." });
        })
        .withFailureHandler(error => {
          resolve({ success: false, message: (error && error.message) ? error.message : String(error) });
        })
        [funcName](...args);
    });
  }

  const payloadStr = JSON.stringify(args);
  const encodedArgs = encodeURIComponent(payloadStr);

  // 2. Jika pengunggahan file PDF besar, gunakan POST fetch
  if (funcName === 'uploadStudentReport' && args[0] && args[0].fileBase64) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: funcName, args: args })
      });
      const data = await res.json();
      return data;
    } catch (err) {
      return { success: false, message: "Gagal mengunggah berkas: " + err.message };
    }
  }

  // 3. Coba Fetch GET Standar Terlebih Dahulu (Cepat & Native CORS)
  const getUrl = `${GAS_API_URL}?action=${encodeURIComponent(funcName)}&args=${encodedArgs}&_ts=${Date.now()}`;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const fetchRes = await fetch(getUrl, {
      method: "GET",
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (fetchRes.ok) {
      const json = await fetchRes.json();
      if (json && typeof json === 'object') {
        return json;
      }
    }
  } catch (fetchErr) {
    console.warn("Fetch GET dilewati, mencoba JSONP transport...", fetchErr);
  }

  // 4. Fallback ke JSONP (Menembus blokir browser/adblocker)
  return new Promise((resolve) => {
    const callbackName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const script = document.createElement('script');
    
    const timeout = setTimeout(() => {
      cleanup();
      resolve({ success: false, message: "Waktu permintaan habis (timeout). Silakan coba lagi atau periksa koneksi." });
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      if (script && script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackName] = function(response) {
      cleanup();
      resolve(response);
    };

    script.onerror = function(err) {
      cleanup();
      resolve({ success: false, message: "Gagal terhubung ke server backend Google. Silakan refresh halaman." });
    };

    script.src = `${GAS_API_URL}?action=${encodeURIComponent(funcName)}&args=${encodedArgs}&callback=${callbackName}&_ts=${Date.now()}`;
    document.body.appendChild(script);
  });
}

// Inisialisasi saat Halaman Dimuat
document.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('ANAK_SALEH_SESSION');
  if (savedUser) {
    try {
      const user = JSON.parse(savedUser);
      setSession(user);
    } catch (e) {
      localStorage.removeItem('ANAK_SALEH_SESSION');
      showLoginView();
    }
  } else {
    showLoginView();
  }
});

// ==========================================
// 1. SESI & AUTENTIKASI
// ==========================================

function showLoginView() {
  document.getElementById('loginContainer').classList.remove('hidden');
  document.getElementById('userNavbarSection').classList.add('hidden');
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('kepsekDashboard').classList.add('hidden');
  document.getElementById('teacherDashboard').classList.add('hidden');
  document.getElementById('parentView').classList.add('hidden');
  switchLoginRole('ORTU');
}

function setSession(user) {
  state.currentUser = user;
  state.activeRole = user.role;
  localStorage.setItem('ANAK_SALEH_SESSION', JSON.stringify(user));

  // Update Navbar
  document.getElementById('loginContainer').classList.add('hidden');
  document.getElementById('userNavbarSection').classList.remove('hidden');
  
  const roleDisplayNames = {
    'ADMIN': 'Administrator',
    'KEPSEK': 'Kepala Sekolah',
    'WALI_KELAS': 'Wali Kelas',
    'GURU': 'Wali Kelas',
    'ORTU': 'Wali Murid'
  };

  document.getElementById('navUserName').innerText = user.namaLengkap || user.namaMurid || user.username || "Pengguna";
  document.getElementById('navUserRoleBadge').innerText = roleDisplayNames[user.role] || user.role;

  // Render Portal Sesuai Role
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('kepsekDashboard').classList.add('hidden');
  document.getElementById('teacherDashboard').classList.add('hidden');
  document.getElementById('parentView').classList.add('hidden');

  if (user.role === 'ADMIN') {
    document.getElementById('adminView').classList.remove('hidden');
    loadAdminDashboardData();
  } else if (user.role === 'KEPSEK') {
    document.getElementById('kepsekDashboard').classList.remove('hidden');
    loadKepsekData();
  } else if (user.role === 'WALI_KELAS' || user.role === 'GURU') {
    document.getElementById('teacherDashboard').classList.remove('hidden');
    loadTeacherData();
  } else if (user.role === 'ORTU') {
    document.getElementById('parentView').classList.remove('hidden');
    loadParentData();
  }
}

function handleLogout() {
  localStorage.removeItem('ANAK_SALEH_SESSION');
  state.currentUser = null;
  state.activeRole = null;
  showToast("Anda telah keluar dari sistem.", "info");
  showLoginView();
}

/**
 * Switch Tab Login 4 Peran
 */
function switchLoginRole(role) {
  const tabs = ['tabBtnOrtu', 'tabBtnGuru', 'tabBtnKepsek', 'tabBtnAdmin'];
  const forms = ['formLoginOrtu', 'formLoginStaff'];

  // Reset tab classes
  tabs.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.className = 'py-2.5 px-3 rounded-xl font-bold text-xs transition text-slate-600 hover:text-slate-800 hover:bg-slate-100 flex items-center justify-center gap-1.5';
    }
  });

  const formOrtu = document.getElementById('formLoginOrtu');
  const formStaff = document.getElementById('formLoginStaff');
  const staffRoleHidden = document.getElementById('loginStaffRoleHidden');
  const staffRoleLabel = document.getElementById('loginStaffRoleLabel');

  if (role === 'ORTU') {
    const activeTab = document.getElementById('tabBtnOrtu');
    if (activeTab) activeTab.className = 'py-2.5 px-3 rounded-xl font-bold text-xs transition bg-teal-600 text-white shadow-md flex items-center justify-center gap-1.5';
    formOrtu.classList.remove('hidden');
    formStaff.classList.add('hidden');
  } else {
    formOrtu.classList.add('hidden');
    formStaff.classList.remove('hidden');

    if (role === 'WALI_KELAS') {
      const activeTab = document.getElementById('tabBtnGuru');
      if (activeTab) activeTab.className = 'py-2.5 px-3 rounded-xl font-bold text-xs transition bg-teal-600 text-white shadow-md flex items-center justify-center gap-1.5';
      if (staffRoleHidden) staffRoleHidden.value = 'WALI_KELAS';
      if (staffRoleLabel) staffRoleLabel.innerText = 'Login Guru / Wali Kelas';
    } else if (role === 'KEPSEK') {
      const activeTab = document.getElementById('tabBtnKepsek');
      if (activeTab) activeTab.className = 'py-2.5 px-3 rounded-xl font-bold text-xs transition bg-purple-700 text-white shadow-md flex items-center justify-center gap-1.5';
      if (staffRoleHidden) staffRoleHidden.value = 'KEPSEK';
      if (staffRoleLabel) staffRoleLabel.innerText = 'Login Kepala Sekolah';
    } else if (role === 'ADMIN') {
      const activeTab = document.getElementById('tabBtnAdmin');
      if (activeTab) activeTab.className = 'py-2.5 px-3 rounded-xl font-bold text-xs transition bg-slate-800 text-white shadow-md flex items-center justify-center gap-1.5';
      if (staffRoleHidden) staffRoleHidden.value = 'ADMIN';
      if (staffRoleLabel) staffRoleLabel.innerText = 'Login Administrator';
    }
  }
}

/**
 * Handle Login Wali Murid
 */
async function handleLoginOrtu(e) {
  e.preventDefault();
  const nis = document.getElementById('loginOrtuNis').value.trim();
  const pin = document.getElementById('loginOrtuPin').value.trim();
  const btn = document.getElementById('btnSubmitLoginOrtu');

  if (!nis || !pin) {
    showToast("Mohon masukkan NIS dan PIN Anda.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> Memeriksa data...';

  const res = await callGAS('handleLogin', {
    role: 'ORTU',
    identifier: nis,
    secret: pin
  });

  btn.disabled = false;
  btn.innerHTML = '<span>Masuk ke Portal Wali Murid</span> <i class="fas fa-arrow-right ml-1"></i>';

  if (res.success && res.data) {
    showToast(res.message || "Login berhasil!", "success");
    setSession(res.data);
  } else {
    showToast(res.message || "NIS atau PIN tidak valid.", "error");
  }
}

/**
 * Handle Login Staff (Guru, Kepsek, Admin)
 */
async function handleLoginStaff(e) {
  e.preventDefault();
  const role = document.getElementById('loginStaffRoleHidden').value;
  const username = document.getElementById('loginStaffUsername').value.trim();
  const password = document.getElementById('loginStaffPassword').value.trim();
  const btn = document.getElementById('btnSubmitLoginStaff');

  if (!username || !password) {
    showToast("Mohon masukkan username dan password.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> Memproses login...';

  const res = await callGAS('handleLogin', {
    role: role,
    identifier: username,
    secret: password
  });

  btn.disabled = false;
  btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="fas fa-arrow-right ml-1"></i>';

  if (res.success && res.data) {
    showToast(res.message || "Selamat datang!", "success");
    setSession(res.data);
  } else {
    showToast(res.message || "Username atau password salah.", "error");
  }
}


// ==========================================
// 2. CONTROLLER KEPALA SEKOLAH (REVIEW & ACC)
// ==========================================

async function loadKepsekData() {
  const refreshIcon = document.getElementById('refreshKepsekIcon');
  if (refreshIcon) refreshIcon.classList.add('fa-spin');

  // Load Summary Stats
  const resSum = await callGAS('getKepsekDashboardSummary');
  if (refreshIcon) refreshIcon.classList.remove('fa-spin');

  if (resSum.success && resSum.data) {
    const d = resSum.data;
    document.getElementById('statKepsekTotalMurid').innerText = d.stats.totalMurid;
    document.getElementById('statKepsekDiajukan').innerText = d.stats.diajukan;
    document.getElementById('statKepsekRevisi').innerText = d.stats.revisi;
    document.getElementById('statKepsekDisetujui').innerText = d.stats.disetujui;

    // Populate Filter Kelompok
    const filterKel = document.getElementById('filterKepsekKelompok');
    if (filterKel && d.kelompokList) {
      state.kepsekData.kelompokList = d.kelompokList;
      let opt = '<option value="SEMUA">Semua Kelompok</option>';
      d.kelompokList.forEach(k => {
        opt += `<option value="${k.id}">${k.nama} (${k.jenjang})</option>`;
      });
      filterKel.innerHTML = opt;
    }
  }

  // Load Reports Table
  await filterKepsekTable();
}

async function filterKepsekTable() {
  const filterKelompok = document.getElementById('filterKepsekKelompok') ? document.getElementById('filterKepsekKelompok').value : "SEMUA";
  const filterStatus = document.getElementById('filterKepsekStatus') ? document.getElementById('filterKepsekStatus').value : "SEMUA";
  const tbody = document.getElementById('kepsekReportsTableBody');

  tbody.innerHTML = `
    <tr>
      <td colspan="5" class="p-8 text-center text-slate-400">
        <i class="fas fa-spinner fa-spin text-2xl text-purple-600 mb-2"></i>
        <p>Memuat antrean raport...</p>
      </td>
    </tr>
  `;

  const res = await callGAS('getKepsekReportsList', filterKelompok, filterStatus);
  if (res.success && res.data) {
    state.kepsekData.reports = res.data;
    renderKepsekTable(res.data);
  } else {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="p-8 text-center text-rose-500">
          <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
          <p>${res.message || "Gagal memuat antrean raport."}</p>
        </td>
      </tr>
    `;
  }
}

function renderKepsekTable(reports) {
  const tbody = document.getElementById('kepsekReportsTableBody');
  if (!reports || reports.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="p-8 text-center text-slate-400">
          <i class="fas fa-check-circle text-3xl text-emerald-400 mb-2"></i>
          <p class="font-bold text-slate-700">Tidak ada antrean raport</p>
          <p class="text-xs">Semua berkas telah ditinjau atau belum ada pengajuan baru dari Wali Kelas.</p>
        </td>
      </tr>
    `;
    return;
  }

  const badgeMap = {
    'DIAJUKAN': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-sky-100 text-sky-800 border border-sky-300 flex items-center gap-1 w-fit mx-auto"><i class="fas fa-hourglass-half"></i> Menunggu Review</span>',
    'REVISI': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-100 text-rose-800 border border-rose-300 flex items-center gap-1 w-fit mx-auto"><i class="fas fa-exclamation-triangle"></i> Perlu Revisi</span>',
    'DISETUJUI': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1 w-fit mx-auto"><i class="fas fa-check-double"></i> Disetujui (ACC)</span>',
    'DRAF': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1 w-fit mx-auto"><i class="fas fa-pencil-alt"></i> Draf Guru</span>'
  };

  let html = '';
  reports.forEach(r => {
    const badge = badgeMap[r.statusApproval] || r.statusApproval;
    const catatanSnippet = r.catatanPerkembangan ? 
      `<p class="text-xs text-slate-600 line-clamp-2 italic">"${r.catatanPerkembangan}"</p>` : 
      `<span class="text-xs text-slate-400 italic">Tidak ada catatan narasi</span>`;

    const revisiInfo = r.statusApproval === 'REVISI' ? 
      `<div class="mt-1.5 p-2 bg-rose-50 rounded-xl border border-rose-200 text-rose-800 text-[11px]">
        <b>Catatan Revisi Anda:</b> ${r.catatanRevisi}
       </div>` : '';

    html += `
      <tr class="hover:bg-slate-50/80 transition">
        <td class="p-3.5">
          <div class="font-bold text-slate-800 text-sm">${r.namaMurid}</div>
          <div class="text-[11px] text-slate-500">NIS: <b>${r.nis}</b> | Panggilan: ${r.namaPanggilan} (${r.jenisKelamin})</div>
        </td>
        <td class="p-3.5">
          <div class="font-bold text-teal-700">${r.namaKelompok}</div>
          <div class="text-[11px] text-slate-500">Wali Kelas: ${r.waliKelas || r.uploaderUser}</div>
        </td>
        <td class="p-3.5 max-w-xs">
          ${catatanSnippet}
          ${revisiInfo}
        </td>
        <td class="p-3.5 text-center">
          ${badge}
          <div class="text-[10px] text-slate-400 mt-1">TA: ${r.tahunAjaran} (Sem ${r.semester})</div>
        </td>
        <td class="p-3.5 text-center">
          <div class="flex items-center justify-center gap-1.5 flex-wrap">
            <!-- Pratinjau PDF -->
            <button onclick="openPdfModal('${r.urlPdf}', 'Raport - ${r.namaMurid}')" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-1" title="Buka dan baca file raport PDF">
              <i class="fas fa-file-pdf text-rose-500"></i> Pratinjau
            </button>

            <!-- Tombol ACC / Setujui -->
            <button onclick="handleApproveReport('${r.idRaport}', '${r.namaMurid}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-sm flex items-center gap-1" title="Setujui dan terbitkan langsung ke Wali Murid">
              <i class="fas fa-check-circle"></i> ACC
            </button>

            <!-- Tombol Revisi -->
            <button onclick="openRevisiModal('${r.idRaport}', '${r.namaMurid}')" class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition flex items-center gap-1" title="Kembalikan ke Guru untuk diperbaiki">
              <i class="fas fa-edit"></i> Revisi
            </button>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

/**
 * Handle Kepala Sekolah ACC Raport
 */
async function handleApproveReport(reportId, muridName) {
  if (!confirm(`Konfirmasi ACC Raport:\nApakah Anda yakin menyetujui dan menerbitkan raport ananda ${muridName}? Raport akan langsung dapat dilihat dan diunduh oleh Orang Tua.`)) {
    return;
  }

  showToast("Memproses persetujuan (ACC)...", "info");
  const kepsekName = state.currentUser ? state.currentUser.namaLengkap : "Kepala Sekolah";
  const res = await callGAS('approveReportKepsek', reportId, kepsekName);

  if (res.success) {
    showToast(res.message || "Raport berhasil di-ACC!", "success");
    await loadKepsekData();
  } else {
    showToast(res.message || "Gagal menyetujui raport.", "error");
  }
}

/**
 * Buka Modal Berikan Catatan Revisi
 */
function openRevisiModal(reportId, muridName) {
  document.getElementById('revisiReportId').value = reportId;
  document.getElementById('revisiModalSubtitle').innerText = `Murid: ${muridName}`;
  document.getElementById('revisiNotesInput').value = '';
  document.getElementById('modalRevisiKepsek').classList.remove('hidden');
}

function closeRevisiModal() {
  document.getElementById('modalRevisiKepsek').classList.add('hidden');
}

/**
 * Handle Submit Catatan Revisi dari Kepala Sekolah
 */
async function handleRejectSubmit(e) {
  e.preventDefault();
  const reportId = document.getElementById('revisiReportId').value;
  const notes = document.getElementById('revisiNotesInput').value.trim();
  const btn = document.getElementById('btnSubmitRevisi');

  if (!notes) {
    showToast("Mohon tuliskan catatan perbaikan.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Mengirim Catatan...';

  const kepsekName = state.currentUser ? state.currentUser.namaLengkap : "Kepala Sekolah";
  const res = await callGAS('rejectReportKepsek', reportId, notes, kepsekName);

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane mr-1"></i> Kirim Catatan Revisi ke Guru';

  if (res.success) {
    closeRevisiModal();
    showToast(res.message || "Catatan revisi berhasil dikirim ke Wali Kelas!", "success");
    await loadKepsekData();
  } else {
    showToast(res.message || "Gagal mengirim catatan revisi.", "error");
  }
}


// ==========================================
// 3. CONTROLLER WALI KELAS / GURU
// ==========================================

async function loadTeacherData() {
  const refreshIcon = document.getElementById('refreshTeacherIcon');
  if (refreshIcon) refreshIcon.classList.add('fa-spin');

  const kelompokDiampu = state.currentUser ? state.currentUser.kelompokDiampu : "SEMUA";
  const res = await callGAS('getTeacherClassStudents', kelompokDiampu);

  if (refreshIcon) refreshIcon.classList.remove('fa-spin');

  if (res.success && res.data) {
    const d = res.data;
    state.teacherData = d;

    // Update Header & Stats
    document.getElementById('teacherKelompokName').innerText = `${d.infoKelompok.namaKelompok} (${d.infoKelompok.jenjang})`;
    document.getElementById('statTeacherTotalMurid').innerText = d.stats.totalMurid;
    document.getElementById('statTeacherDiajukan').innerText = d.stats.totalDiajukan;
    document.getElementById('statTeacherRevisi').innerText = d.stats.totalRevisi;
    document.getElementById('statTeacherDisetujui').innerText = d.stats.totalDisetujui;

    // Show Revision Alert Banner if any reports in REVISI status
    const banner = document.getElementById('teacherRevisionAlertBanner');
    if (banner) {
      if (d.stats.totalRevisi > 0) {
        banner.classList.remove('hidden');
        document.getElementById('teacherRevisionAlertText').innerText = 
          `Terdapat ${d.stats.totalRevisi} raport yang dikembalikan oleh Kepala Sekolah untuk diperbaiki. Silakan cek catatan evaluasi dan unggah berkas perbaikan.`;
      } else {
        banner.classList.add('hidden');
      }
    }

    renderTeacherTable(d.muridList);
  } else {
    showToast(res.message || "Gagal memuat data kelompok guru.", "error");
  }
}

function renderTeacherTable(muridList) {
  const tbody = document.getElementById('teacherStudentsTableBody');
  if (!muridList || muridList.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="p-8 text-center text-slate-400">
          <i class="fas fa-user-slash text-2xl mb-2"></i>
          <p>Belum ada murid yang terdaftar di kelompok ini.</p>
        </td>
      </tr>
    `;
    return;
  }

  const badgeMap = {
    'BELUM_UPLOAD': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 border border-slate-200"><i class="fas fa-minus-circle mr-1"></i> Belum Diunggah</span>',
    'DRAF': '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300"><i class="fas fa-pencil-alt mr-1"></i> Draf Guru</span>',

/**
 * Guru mengajukan raport langsung ke Kepala Sekolah
 */
async function handleSubmitReportToKepsek(reportId, muridName) {
  if (!confirm(`Ajukan Raport ke Kepala Sekolah:\nApakah Anda yakin ingin mengajukan raport ananda ${muridName} untuk ditinjau oleh Kepala Sekolah?`)) {
    return;
  }

  showToast("Mengajukan raport ke Kepala Sekolah...", "info");
  const teacherName = state.currentUser ? state.currentUser.namaLengkap : "Wali Kelas";
  const res = await callGAS('submitReportToKepsek', reportId, teacherName);

  if (res.success) {
    showToast(res.message || "Raport berhasil diajukan ke Kepala Sekolah!", "success");
    await loadTeacherData();
  } else {
    showToast(res.message || "Gagal mengajukan raport.", "error");
  }
}

/**

function openDetailRevisiModal(nis, namaMurid, catatanRevisi, raportId) {
  document.getElementById('detailRevisiMuridName').innerText = `Murid: ${namaMurid} (NIS: ${nis})`;

}

/**
 * Buka Modal Upload Raport
 */
function openModalUpload(nis, namaMurid, idKelompok, existingRaport) {
  document.getElementById('uploadNis').value = nis;
  document.getElementById('uploadNamaMurid').value = namaMurid;
  document.getElementById('uploadIdKelompok').value = idKelompok || (state.teacherData.infoKelompok ? state.teacherData.infoKelompok.idKelompok : "");
  document.getElementById('uploadModalSubtitle').innerText = `Murid: ${namaMurid} (NIS: ${nis})`;
  
  document.getElementById('uploadCatatan').value = existingRaport ? (existingRaport.catatanPerkembangan || "") : "";
  document.getElementById('uploadPdfFile').value = "";
  document.getElementById('uploadExistingUrl').value = existingRaport ? (existingRaport.urlPdf || "") : "";
  document.getElementById('uploadExistingFileId').value = existingRaport ? (existingRaport.fileId || "") : "";

  // Checkbox status pengajuan langsung ke Kepsek
  const chk = document.getElementById('uploadStatusPublish');
  if (chk) chk.checked = true;

  document.getElementById('modalUploadRaport').classList.remove('hidden');
}

/**
 * Submit Form Upload Raport PDF
 */
async function handleUploadSubmit(e) {
  e.preventDefault();
  const nis = document.getElementById('uploadNis').value;
  const idKelompok = document.getElementById('uploadIdKelompok').value;
  const catatan = document.getElementById('uploadCatatan').value.trim();
  const fileInput = document.getElementById('uploadPdfFile');
  const existingUrl = document.getElementById('uploadExistingUrl').value;
  const existingFileId = document.getElementById('uploadExistingFileId').value;
  const directSubmit = document.getElementById('uploadStatusPublish') ? document.getElementById('uploadStatusPublish').checked : true;
  const btn = document.getElementById('btnSubmitUpload');

  if (!fileInput.files[0] && !existingUrl) {
    showToast("Silakan pilih file PDF raport terlebih dahulu.", "warning");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan & Mengunggah...';

  let base64 = "";
  let fileName = "";
  let mimeType = "application/pdf";

  if (fileInput.files[0]) {
    const file = fileInput.files[0];
    fileName = file.name;
    mimeType = file.type || "application/pdf";
    base64 = await fileToBase64(file);
  }

  const payload = {
    nis: nis,
    idKelompok: idKelompok,
    tahunAjaran: state.teacherData.activeTA ? state.teacherData.activeTA.tahun : "2025/2026",
    semester: state.teacherData.activeTA ? state.teacherData.activeTA.semester : "Ganjil",
    catatan: catatan,
    fileBase64: base64,
    fileName: fileName,
    mimeType: mimeType,
    existingUrl: existingUrl,
    existingFileId: existingFileId,
    statusApproval: directSubmit ? "DIAJUKAN" : "DRAF",
    uploaderUser: state.currentUser ? state.currentUser.namaLengkap : "Wali Kelas"
  };

  const res = await callGAS('uploadStudentReport', payload);

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-1"></i> Simpan & Unggah Raport';

  if (res.success) {
    document.getElementById('modalUploadRaport').classList.add('hidden');
    showToast(res.message || "Raport berhasil disimpan dan diajukan!", "success");
    await loadTeacherData();
  } else {
    showToast(res.message || "Gagal mengunggah raport.", "error");
  }
}

    renderParentView(res.data);

async function handleConfirmReceipt(reportId) {
  const parentName = prompt("Silakan masukkan Nama Lengkap Ayah / Bunda yang mengonfirmasi:", (state.currentUser ? state.currentUser.namaAyah || state.currentUser.namaIbu : "") || "Wali Murid");
  if (!parentName || parentName.trim() === "") return;

  showToast("Menyimpan konfirmasi...", "info");
  const res = await callGAS('confirmReportViewedByParent', reportId, parentName.trim());
  if (res.success) {
    showToast(res.message || "Konfirmasi berhasil disimpan.", "success");
    await loadParentData();
  } else {
    showToast(res.message || "Gagal menyimpan konfirmasi.", "error");
  }
}

let currentAdminTab = 'siswa';

async function loadAdminDashboardData() {
  const refreshBtn = document.querySelector('button[onclick="loadAdminDashboardData()"]');

  const res = await callGAS('getAdminAllData');
  if (refreshBtn) refreshBtn.innerHTML = '<i class="fas fa-sync-alt mr-1"></i> Refresh Data';

  if (res.success && res.data) {
    const d = res.data;
    const s = d.summary;
    state.adminData.students = d.students || [];
    state.adminData.teachers = d.teachers || [];
    state.adminData.classes = d.classes || [];
    state.adminData.years = d.years || [];

    // Update Summary Stats Cards
    if (s) {
      if (document.getElementById('statTotalSiswa')) document.getElementById('statTotalSiswa').innerText = s.totalMurid;
      if (document.getElementById('statTotalGuru')) document.getElementById('statTotalGuru').innerText = `${s.totalGuru} Guru / ${s.totalKepsek} Kepsek`;
      if (document.getElementById('statTotalKelas')) document.getElementById('statTotalKelas').innerText = `${s.totalKelompok} Kelompok Belajar`;

        document.getElementById('statStatusAksesOrtu').innerText = `Akses Ortu: ${s.activeTA.statusAksesOrtu}`;
      }
      if (s.raportStats && document.getElementById('statRaportUploaded')) {
        document.getElementById('statRaportUploaded').innerText = `${s.raportStats.disetujui} ACC / ${s.raportStats.diajukan} Diajukan`;
      }
      if (s.perJenjang && document.getElementById('statJenjangBreakdown')) {
        document.getElementById('statJenjangBreakdown').innerText = 
          `PG: ${s.perJenjang["Playgroup (PG)"] || 0} | TK-A: ${s.perJenjang["TK-A"] || 0} | TK-B: ${s.perJenjang["TK-B"] || 0} | DC: ${s.perJenjang["Daycare"] || 0}`;
      }
    }

    // Render all in-memory tables & grids instantly
    renderAdminStudentsTable(state.adminData.students);
    renderAdminTeachersTable(state.adminData.teachers);
    renderAdminClassesGrid(state.adminData.classes);
    renderAdminTATable(state.adminData.years);
  } else {
    showToast(res.message || "Gagal memuat data master.", "error");
  }
}

function switchAdminTab(tabName) {
  currentAdminTab = tabName;
  const tabs = ['siswa', 'guru', 'kelas', 'tahun', 'logs'];
  tabs.forEach(t => {
    const btn = document.getElementById(`adminTabBtn_${t}`);
    const content = document.getElementById(`adminTabContent_${t}`);
    if (t === tabName) {
      if (btn) btn.className = 'admin-tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-teal-600 text-white shadow-sm';
      if (content) content.classList.remove('hidden');
    } else {
      if (btn) btn.className = 'admin-tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-50';
      if (content) content.classList.add('hidden');
    }
  });

  // Re-render instantly from memory or fetch logs
  if (tabName === 'siswa') {
    filterSiswaTable();
  } else if (tabName === 'guru') {
    renderAdminTeachersTable(state.adminData.teachers);
  } else if (tabName === 'kelas') {
    renderAdminClassesGrid(state.adminData.classes);
  } else if (tabName === 'tahun') {
    renderAdminTATable(state.adminData.years);
  } else if (tabName === 'logs') {
    loadAdminLogs();
  }
}

async function handleBulkImportSubmit(e) {
  e.preventDefault();
  const text = document.getElementById('bulkCsvTextarea').value.trim();
  if (!text) {
    showToast("Silakan masukkan data CSV atau teks.", "warning");
    return;
  }

  const lines = text.split('\n');
  const students = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line.startsWith('NIS')) continue;

    const parts = line.split(/[,;\t]/);
    if (parts.length >= 2) {
      students.push({
        nis: parts[0] ? parts[0].trim() : "",
        namaLengkap: parts[1] ? parts[1].trim() : "",
        namaPanggilan: parts[2] ? parts[2].trim() : "",
        jenisKelamin: parts[3] ? parts[3].trim() : "L",
        jenjang: parts[4] ? parts[4].trim() : "TK-A",
        idKelompok: parts[5] ? parts[5].trim() : "TK-A1",
        tempatLahir: parts[6] ? parts[6].trim() : "",
        tanggalLahir: parts[7] ? parts[7].trim() : "",
        namaAyah: parts[8] ? parts[8].trim() : "",
        namaIbu: parts[9] ? parts[9].trim() : "",
        kontakOrtu: parts[10] ? parts[10].trim() : "",
        alamat: parts[11] ? parts[11].trim() : "",
        pin: parts[12] ? parts[12].trim() : ""
      });
    }
  }

  if (students.length === 0) {
    showToast("Format data tidak sesuai. Pastikan ada kolom NIS dan Nama.", "warning");
    return;
  }

  showToast(`Memproses import massal ${students.length} data murid...`, "info");
  const res = await callGAS('bulkSaveStudentsAdmin', students, state.currentUser ? state.currentUser.namaLengkap : "ADMIN");
  if (res.success) {
    document.getElementById('modalBulkUpload').classList.add('hidden');
    showToast(res.message || "Import massal murid berhasil!", "success");
    await loadAdminDashboardData();
  } else {
    showToast(res.message || "Gagal import massal.", "error");
  }
}

function openPdfModal(url, title) {
  const modal = document.getElementById('modalPdfViewer');

  const titleEl = document.getElementById('pdfModalTitle');

  let cleanUrl = url;
  if (url.includes('drive.google.com/file/d/')) {
    cleanUrl = url.replace('/view', '/preview').replace('?usp=drivesdk', '');
  }

  titleEl.innerText = title || "Pratinjau Raport Digital";
  iframe.src = cleanUrl;
  modal.classList.remove('hidden');
}

function closePdfModal() {
  const modal = document.getElementById('modalPdfViewer');
  const iframe = document.getElementById('pdfModalIframe');
  iframe.src = "";
  modal.classList.add('hidden');
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toastNotification');
  const msgEl = document.getElementById('toastMessage');
  const iconEl = document.getElementById('toastIcon');

  msgEl.innerText = message;
  
  if (type === 'success') {
    iconEl.className = "fas fa-check-circle text-emerald-400 text-lg";
  } else if (type === 'error') {
    iconEl.className = "fas fa-exclamation-circle text-rose-400 text-lg";
  } else if (type === 'warning') {
    iconEl.className = "fas fa-exclamation-triangle text-amber-400 text-lg";
  } else {
    iconEl.className = "fas fa-info-circle text-sky-400 text-lg";
  }

  toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
  }, 4000);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}
